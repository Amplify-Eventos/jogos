<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#120c09">
  <title>Street Legends BR</title>
  <link rel="stylesheet" href="game.css?v=0.21">
</head>
<body>
  <canvas id="tela"></canvas>

  <header id="hud" hidden>
    <div class="lado">
      <strong id="nome-a"></strong>
      <div class="barra"><span id="vida-a"></span></div>
    </div>
    <div id="relogio">60</div>
    <div class="lado direita">
      <strong id="nome-b"></strong>
      <div class="barra"><span id="vida-b"></span></div>
    </div>
  </header>

  <p id="aviso"></p>

  <div id="toque" hidden>
    <div id="stick" aria-hidden="true"><span id="nub"></span></div>
    <div id="botoes">
      <button type="button" data-g="esquiva">Esquiva</button>
      <button type="button" data-g="guarda">Guarda</button>
      <button type="button" data-g="soco">Soco</button>
      <button type="button" data-g="chute">Chute</button>
      <button type="button" data-g="agarra">Agarra</button>
      <button type="button" data-g="especial">Extra</button>
    </div>
  </div>

  <section id="escolhe">
    <div class="painel">
      <p class="marca">Rua</p>
      <h1>Street Legends BR</h1>
      <p>Dois nomes inventados. Você anda, soca, chuta, guarda, esquiva e agarra.</p>
      <div class="cartas">
        <button type="button" id="escolhe-kadu" class="carta ligada">Kadu Laje<br><small>Mão rápida</small></button>
        <button type="button" id="escolhe-nilo" class="carta">Nilo Brasa<br><small>Corpo</small></button>
      </div>
      <button type="button" id="lutar">Lutar</button>
      <p class="teclas">Teclado: WASD, J soco, K chute, L guarda, espaço esquiva, F agarra, E extra.</p>
    </div>
  </section>

  <section id="fim" hidden>
    <div class="painel">
      <h2 id="fim-titulo"></h2>
      <p id="fim-texto"></p>
      <button type="button" id="de-novo">De novo</button>
    </div>
  </section>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js"
    }
  }
  </script>
  <script type="module">
    import("./game.js?v=0.21").catch((erro) => {
      const aviso = document.getElementById("aviso");
      aviso.hidden = false;
      aviso.textContent = "Não abriu o 3D. " + (erro && erro.message ? erro.message : "");
    });
  </script>
</body>
</html>
