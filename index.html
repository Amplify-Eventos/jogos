<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#070b10" />
  <title>Amplify Jogos</title>
  <link rel="stylesheet" href="loja.css" />
</head>
<body>
  <header class="bar">
    <a class="logo" href="./">AMPLIFY <b>JOGOS</b></a>
    <nav>
      <a class="on" href="./">Loja</a>
      <a href="enviar/">Enviar</a>
      <a href="como/">Publicar</a>
    </nav>
  </header>
  <main class="wrap">
    <section class="hero" id="hero" style="background-image:url('hemp-kush/art/loja-recebe.jpg')">
      <div class="veil"></div>
      <div class="copy">
        <p class="kicker">Em destaque</p>
        <h1 id="hero-nome">Hemp Kush</h1>
        <p class="lede">Joga no navegador. Sem instalar.</p>
        <a class="play" id="hero-play" href="hemp-kush/">Jogar agora</a>
      </div>
    </section>
    <h2 class="sec">Na loja</h2>
    <div id="lista">
      <a class="game" href="hemp-kush/">
        <img src="hemp-kush/art/loja-recebe.jpg" alt="" />
        <div class="meta"><strong>Hemp Kush</strong><span>Jogar</span></div>
      </a>
      <a class="game" href="lume/">
        <img src="lume/art/capa.jpg" alt="" />
        <div class="meta"><strong>Lume</strong><span>Jogar</span></div>
      </a>
    </div>
    <p class="soon" id="vazio" hidden>A loja ainda está vazia.</p>
  </main>
  <script>
    function capaQuebrada(img) {
      img.addEventListener("error", function () { img.remove(); });
    }
    function card(jogo) {
      var a = document.createElement("a");
      a.className = "game";
      a.href = jogo.slug + "/";
      if (jogo.capa) {
        var img = document.createElement("img");
        img.alt = "";
        img.src = jogo.capa;
        capaQuebrada(img);
        a.appendChild(img);
      }
      var meta = document.createElement("div");
      meta.className = "meta";
      var nome = document.createElement("strong");
      nome.textContent = jogo.nome;
      var jogar = document.createElement("span");
      jogar.textContent = "Jogar";
      meta.appendChild(nome);
      meta.appendChild(jogar);
      a.appendChild(meta);
      return a;
    }
    fetch("jogos.json")
      .then(function (res) { return res.json(); })
      .then(function (lista) {
        if (!lista || !lista.length) {
          document.getElementById("vazio").hidden = false;
          return;
        }
        var destaque = lista[0];
        var hero = document.getElementById("hero");
        if (destaque.capa) hero.style.backgroundImage = "url('" + destaque.capa + "')";
        document.getElementById("hero-nome").textContent = destaque.nome;
        document.getElementById("hero-play").href = destaque.slug + "/";
        var host = document.getElementById("lista");
        host.textContent = "";
        lista.forEach(function (jogo) { host.appendChild(card(jogo)); });
      })
      .catch(function () {});
    document.querySelectorAll("a.game img").forEach(capaQuebrada);
  </script>
</body>
</html>
