<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Exército Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --panel:rgba(255,255,255,.95);
  --panel2:#eef2ff;
  --ink:#1c2447;
  --muted:#5b6485;
  --good:#2f7bff;
  --bad:#ff3b55;
  --gold:#ffb300;
  --font:"Lilita One","Arial Black",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --panel:rgba(22,26,46,.96); --panel2:#2a3052; --ink:#eef1ff; --muted:#a7afd3; }
}
:root[data-theme="dark"]{ --panel:rgba(22,26,46,.96); --panel2:#2a3052; --ink:#eef1ff; --muted:#a7afd3; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
html,body{ height:100%; margin:0; overflow:hidden; background:#9fd4ff; font-family:var(--font);
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
canvas#game{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }

.hud{ position:fixed; top:0; left:0; right:0; padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;
  display:flex; align-items:flex-start; justify-content:space-between; gap:10px; pointer-events:none; z-index:5; }
.chip{ background:var(--panel); color:var(--ink); border-radius:14px; padding:6px 12px;
  box-shadow:0 6px 18px rgba(20,30,70,.22); font-size:17px; line-height:1.15; white-space:nowrap; }
.chip small{ display:block; font-family:system-ui,sans-serif; font-weight:600; font-size:11px; color:var(--muted); }
.center{ flex:1; max-width:260px; display:flex; flex-direction:column; gap:8px; padding-top:6px; }
.bar{ height:12px; background:rgba(0,0,0,.22); border-radius:8px; overflow:hidden; border:2px solid rgba(255,255,255,.95); }
.bar>i{ display:block; height:100%; width:0%; background:linear-gradient(90deg,#43e97b,#38f9d7); }
#bossWrap{ display:none; }
#bossWrap .lbl{ color:#fff; font-size:15px; text-align:center; background:rgba(20,25,50,.72); border-radius:10px; padding:2px 10px; margin:0 auto 4px; width:max-content; }
#bossBar{ height:16px; }
#bossBar>i{ background:linear-gradient(90deg,#ff3b55,#ff8a3d); width:100%; transition:width .1s; }

.wchip{ position:fixed; left:12px; bottom:calc(env(safe-area-inset-bottom,0px) + 14px); z-index:5; pointer-events:none; min-width:150px; }
.wchip .bar{ height:8px; margin-top:4px; border-width:1px; }
.wchip .bar>i{ background:linear-gradient(90deg,#ffb300,#ffe14d); }
#ultBtn{ position:fixed; right:14px; bottom:calc(env(safe-area-inset-bottom,0px) + 14px); z-index:6; width:84px; height:84px;
  border-radius:50%; border:4px solid #fff; padding:0; cursor:pointer; font-family:var(--font); color:#fff;
  background:conic-gradient(var(--gold) var(--p,0%), rgba(20,25,50,.55) 0); box-shadow:0 6px 16px rgba(0,0,0,.3); display:none; }
#ultBtn span{ display:flex; flex-direction:column; align-items:center; justify-content:center; width:66px; height:66px; margin:auto;
  border-radius:50%; background:rgba(20,25,50,.8); font-size:12px; line-height:1.1; }
#ultBtn span b{ font-size:26px; font-weight:400; }
#ultBtn.ready{ animation:pulse 1s ease-in-out infinite; }
#ultBtn.ready span{ background:linear-gradient(180deg,#ffc933,#ff8a00); }
#ultBtn:focus-visible{ outline:4px solid var(--good); outline-offset:3px; }
@keyframes pulse{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }

#armyLabel{ position:fixed; left:0; top:0; background:var(--good); color:#fff; font-size:22px; padding:1px 14px 3px;
  border-radius:20px; border:3px solid #fff; box-shadow:0 4px 12px rgba(0,0,0,.25); pointer-events:none; z-index:4; will-change:transform; }
#toast{ position:fixed; left:50%; top:30%; transform:translate(-50%,-50%); font-size:56px; opacity:0; pointer-events:none; z-index:6;
  text-shadow:3px 3px 0 #fff,-3px -3px 0 #fff,3px -3px 0 #fff,-3px 3px 0 #fff,0 3px 0 #fff,0 -3px 0 #fff,0 10px 18px rgba(0,0,0,.3); white-space:nowrap; }
#toast.show{ animation:pop 1.1s ease-out; }
@keyframes pop{
  0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}
  15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
  30%{transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-110%) scale(1)}
}
#hint{ position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 120px); transform:translateX(-50%);
  color:#fff; font-size:24px; text-shadow:0 2px 0 rgba(0,0,0,.4); pointer-events:none; z-index:4; transition:opacity .5s; opacity:0; }

.overlay{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  background:rgba(15,25,60,.42); z-index:10; padding:16px; box-sizing:border-box; }
.overlay.hidden{ display:none; }
.card{ background:var(--panel); color:var(--ink); border-radius:26px; padding:22px 20px 24px; max-width:420px; width:100%;
  max-height:100%; overflow-y:auto; text-align:center; box-shadow:0 18px 40px rgba(10,20,60,.35); box-sizing:border-box; }
.card h1{ margin:0; font-size:42px; font-weight:400; line-height:1; color:var(--good); }
.card h2{ margin:0; font-size:38px; font-weight:400; line-height:1.05; }
.card h3{ margin:18px 0 8px; font-size:20px; font-weight:400; text-align:left; }
.card p{ font-family:system-ui,sans-serif; font-size:15px; line-height:1.45; color:var(--muted); margin:10px 0 16px; }
.wallet{ display:inline-block; margin-top:10px; background:var(--panel2); border-radius:12px; padding:5px 14px; font-size:20px; }
.heroes{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.hero{ background:var(--panel2); border:3px solid transparent; border-radius:16px; padding:10px 8px; text-align:left; cursor:pointer;
  font-family:inherit; color:var(--ink); }
.hero.sel{ border-color:var(--good); }
.hero.locked{ opacity:.8; }
.hero .nm{ font-size:17px; display:flex; align-items:center; gap:6px; }
.hero .dot{ width:14px; height:14px; border-radius:50%; border:2px solid #fff; flex:none; }
.hero .ds{ font-family:system-ui,sans-serif; font-size:12px; line-height:1.35; color:var(--muted); margin-top:4px; }
.hero .pr{ margin-top:6px; font-size:15px; color:var(--gold); }
.ups{ display:flex; flex-direction:column; gap:8px; }
.up{ display:flex; align-items:center; gap:10px; background:var(--panel2); border-radius:14px; padding:8px 10px; text-align:left; }
.up .tx{ flex:1; }
.up .tx b{ font-weight:400; font-size:16px; }
.up .tx small{ display:block; font-family:system-ui,sans-serif; font-size:12px; color:var(--muted); }
.buy{ font-family:var(--font); font-size:15px; color:#fff; background:var(--good); border:none; border-radius:12px; padding:8px 12px;
  cursor:pointer; white-space:nowrap; box-shadow:0 3px 0 #1d55b8; }
.buy:disabled{ background:#9aa3bd; box-shadow:none; cursor:default; }
.buy:focus-visible,.hero:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
button.play{ font-family:var(--font); font-size:26px; color:#fff; background:linear-gradient(180deg,#ffc933,#ff9d00);
  border:none; border-radius:18px; padding:12px 36px; box-shadow:0 6px 0 #c46f00,0 10px 20px rgba(0,0,0,.2); cursor:pointer; margin-top:18px; }
button.play:active{ transform:translateY(4px); box-shadow:0 2px 0 #c46f00; }
button.play:focus-visible{ outline:4px solid var(--good); outline-offset:4px; }
button.ghost{ font-family:var(--font); font-size:18px; color:var(--ink); background:var(--panel2); border:none; border-radius:14px;
  padding:10px 20px; margin-top:12px; cursor:pointer; }
.legend{ display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin:4px 0 0; }
.legend b{ font-weight:400; font-size:13px; color:#fff; padding:3px 9px; border-radius:9px; }
#toast{ z-index:11; }
#banner{ position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 66px); transform:translate(-50%,-14px); background:var(--panel); color:var(--ink);
  padding:8px 16px; border-radius:14px; font-size:15px; box-shadow:0 8px 20px rgba(0,0,0,.25); opacity:0; transition:opacity .3s, transform .3s;
  z-index:12; pointer-events:none; max-width:88vw; text-align:center; }
#banner.show{ opacity:1; transform:translate(-50%,0); }
.dist{ display:none; color:#fff; font-size:22px; text-align:center; background:rgba(20,25,50,.7); border-radius:12px; padding:2px 14px; margin:0 auto; width:max-content; }
.tabs{ display:flex; gap:4px; margin:14px 0 6px; background:var(--panel2); padding:4px; border-radius:14px; }
.tab{ flex:1; font-family:var(--font); font-size:15px; border:none; border-radius:10px; padding:8px 2px; background:transparent; color:var(--muted); cursor:pointer; }
.tab.on{ background:var(--good); color:#fff; }
.tab:focus-visible,.tog:focus-visible,.skin:focus-visible,.seg button:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
.map{ height:clamp(340px,56vh,640px); overflow-y:auto; overflow-x:hidden; border-radius:22px; background:#8fd3ff; margin:10px 0 4px;
  -webkit-overflow-scrolling:touch; touch-action:pan-y; box-shadow:inset 0 0 0 4px rgba(255,255,255,.8), 0 8px 20px rgba(120,30,90,.2); scrollbar-width:thin; }
.map svg{ display:block; width:100%; height:auto; }
.map .pin{ animation:pinb 1.1s ease-in-out infinite; }
.map .burst{ transform-box:fill-box; transform-origin:center; animation:spin 12s linear infinite; }
@keyframes pinb{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
@keyframes spin{ to{transform:rotate(360deg)} }
@media (prefers-reduced-motion: reduce){ .map .pin,.map .burst{ animation:none; } }
.map .node{ cursor:pointer; }
.map .nn{ font-family:var(--font); font-size:19px; fill:#fff; text-anchor:middle; }
.map .ni{ font-size:17px; text-anchor:middle; }
.map .ns{ font-size:13px; fill:#ff9d00; text-anchor:middle; font-family:system-ui; }
.map .pd{ stroke:#2f7bff; stroke-width:7; stroke-linecap:round; }
.map .pf{ stroke:#9aa3bd; stroke-width:6; stroke-dasharray:1 12; stroke-linecap:round; }
.map .nc{ stroke:#fff; stroke-width:4; }
.map .pulse{ fill:none; stroke:#fff; stroke-width:5; transform-box:fill-box; transform-origin:center; animation:ring 1.4s ease-out infinite; }
@keyframes ring{ 0%{transform:scale(.8);opacity:1} 100%{transform:scale(1.35);opacity:0} }
.toggles{ display:flex; gap:6px; justify-content:center; margin-top:16px; flex-wrap:wrap; }
.tog{ font-family:system-ui; font-weight:600; font-size:13px; border:none; border-radius:20px; padding:7px 12px; background:var(--panel2); color:var(--muted); cursor:pointer; opacity:.55; }
.tog.on{ opacity:1; color:var(--ink); box-shadow:inset 0 0 0 2px var(--good); }
.skins{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.skin{ background:var(--panel2); border:3px solid transparent; border-radius:14px; padding:8px 4px; cursor:pointer; font-family:inherit; color:var(--ink);
  display:flex; flex-direction:column; align-items:center; gap:3px; }
.skin.sel{ border-color:var(--good); }
.skin .sw{ width:34px; height:34px; border-radius:50%; border:3px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.25); }
.skin b{ font-weight:400; font-size:14px; }
.skin small{ font-family:system-ui; font-size:11px; color:var(--muted); }
.pbar{ height:7px; background:rgba(0,0,0,.12); border-radius:5px; overflow:hidden; margin:5px 0 2px; }
.pbar i{ display:block; height:100%; background:linear-gradient(90deg,#43e97b,#38f9d7); }
.up .ic{ font-size:22px; }
.ach{ opacity:.7; } .ach.got{ opacity:1; }
.card p.sub{ font-size:13px; margin:0 0 8px; text-align:left; }
.seg{ display:flex; gap:6px; margin:12px 0; }
.seg button{ flex:1; font-family:var(--font); font-size:16px; border:none; border-radius:12px; padding:8px; background:var(--panel2); color:var(--muted); cursor:pointer; }
.seg button.on{ background:var(--gold); color:#fff; }
.rank{ display:flex; flex-direction:column; gap:6px; }
.rrow{ display:flex; align-items:center; gap:10px; background:var(--panel2); border-radius:12px; padding:8px 12px; text-align:left; }
.rrow.me{ box-shadow:inset 0 0 0 3px var(--good); }
.rrow .pos{ width:28px; font-size:18px; text-align:center; }
.rrow .nm{ flex:1; font-family:system-ui; font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rrow .vl{ font-size:16px; }
.stars{ font-size:38px; color:#ffb300; letter-spacing:4px; margin-top:6px; }
.chest{ font-size:72px; background:none; border:none; cursor:pointer; animation:bob 1.2s ease-in-out infinite; line-height:1; }
.chest.open{ animation:shake .6s; }
.chest:focus-visible{ outline:3px solid var(--gold); border-radius:16px; }
@keyframes bob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
@keyframes shake{ 0%,100%{transform:rotate(0)} 20%{transform:rotate(-14deg) scale(1.1)} 40%{transform:rotate(12deg) scale(1.15)} 60%{transform:rotate(-8deg) scale(1.2)} 80%{transform:rotate(6deg) scale(1.1)} }
.reward{ font-size:20px; margin:6px 0 2px; }
.small{ font-family:system-ui; font-size:13px; color:var(--muted); }
.home{ position:fixed; inset:0; z-index:10; background:linear-gradient(180deg,#ffd6ea,#ffbfdc); }
.home.hidden{ display:none; }
.mapwrap{ position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; touch-action:pan-y; scrollbar-width:none; }
.mapwrap::-webkit-scrollbar{ display:none; }
.mapwrap svg{ display:block; width:100%; max-width:560px; height:auto; margin:0 auto; box-shadow:0 0 40px rgba(150,40,110,.25); }
.mapwrap .node{ cursor:pointer; }
.mapwrap .node:focus{ outline:none; }
.mapwrap .pulse{ fill:none; stroke:#fff; stroke-width:5; transform-box:fill-box; transform-origin:center; animation:ring 1.4s ease-out infinite; }
.mapwrap .pin{ animation:pinb 1.1s ease-in-out infinite; }
.mapwrap .burst{ transform-box:fill-box; transform-origin:center; animation:spin 12s linear infinite; }
.mapwrap .newnode{ transform-box:fill-box; transform-origin:center; animation:popin .7s cubic-bezier(.3,1.6,.5,1) both .55s; }
@keyframes popin{ 0%{transform:scale(.2)} 100%{transform:scale(1)} }
@keyframes pinb{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
@keyframes spin{ to{transform:rotate(360deg)} }
.topbar{ position:absolute; top:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0; pointer-events:none; }
.topbar>*{ pointer-events:auto; }
.avatar{ position:relative; width:54px; height:54px; border-radius:50%; border:4px solid #fff; background:radial-gradient(circle at 35% 30%,#ffe27a,#ff8a00);
  font-size:26px; cursor:pointer; box-shadow:0 4px 12px rgba(150,40,110,.35); padding:0; }
.avatar b{ position:absolute; right:-8px; bottom:-6px; min-width:24px; height:24px; border-radius:12px; background:#e0306f; color:#fff; font:400 13px/24px var(--font);
  border:2px solid #fff; padding:0 4px; }
.cpill{ flex:1; max-width:170px; margin:0 auto; background:linear-gradient(180deg,#fff,#ffe6f2); border:3px solid #fff; border-radius:20px; padding:5px 14px;
  font-size:19px; color:#7a2a5a; text-align:center; box-shadow:0 4px 12px rgba(150,40,110,.3); }
.gear{ width:46px; height:46px; border-radius:50%; border:3px solid #fff; background:linear-gradient(180deg,#ff8fc1,#e0306f); font-size:22px; cursor:pointer;
  box-shadow:0 4px 12px rgba(150,40,110,.35); padding:0; }
.worldpill{ position:absolute; top:calc(env(safe-area-inset-top,0px) + 74px); left:50%; transform:translateX(-50%); background:linear-gradient(180deg,#a678ff,#6a3fd6);
  color:#fff; border:3px solid #fff; border-radius:16px; padding:5px 16px; font-size:16px; white-space:nowrap; box-shadow:0 4px 12px rgba(80,40,150,.35); pointer-events:none; }
.sidebtns{ position:absolute; left:10px; top:calc(env(safe-area-inset-top,0px) + 130px); display:flex; flex-direction:column; gap:12px; }
.sbtn{ position:relative; width:62px; height:62px; border-radius:20px; border:3px solid #fff; background:linear-gradient(180deg,#ffffff,#ffe1ef); cursor:pointer;
  box-shadow:0 5px 12px rgba(150,40,110,.3); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0; color:#7a2a5a; }
.sbtn span{ font-size:24px; line-height:1; } .sbtn small{ font:400 10.5px var(--font); margin-top:2px; }
.dotb{ position:absolute; top:-6px; right:-6px; min-width:20px; height:20px; border-radius:10px; background:#ff2d55; color:#fff; font:400 12px/20px var(--font);
  font-style:normal; border:2px solid #fff; display:none; }
.dotb.show{ display:block; }
.bottomnav{ position:absolute; left:0; right:0; bottom:0; display:flex; gap:4px; padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 8px);
  background:linear-gradient(180deg,#ff8fc1,#d82a6c); border-top:3px solid #fff; box-shadow:0 -6px 18px rgba(150,40,110,.3); z-index:4; }
.nb{ position:relative; flex:1; border:none; background:transparent; color:#fff; font:400 13px var(--font); display:flex; flex-direction:column; align-items:center;
  gap:2px; padding:6px 0; border-radius:14px; cursor:pointer; }
.nb span{ font-size:24px; line-height:1; }
.nb.on{ background:rgba(255,255,255,.25); box-shadow:inset 0 0 0 2px rgba(255,255,255,.6); }
.nb .dotb{ right:18%; top:0; }
.sheet{ position:absolute; inset:0; background:rgba(60,10,50,.45); display:flex; align-items:flex-end; justify-content:center; z-index:2; }
.sheet.hidden,.pop.hidden{ display:none; }
.sheetCard{ background:var(--panel); color:var(--ink); width:100%; max-width:520px; max-height:82%; overflow-y:auto; border-radius:26px 26px 0 0;
  padding:16px 18px calc(env(safe-area-inset-bottom,0px) + 90px); box-sizing:border-box; box-shadow:0 -10px 30px rgba(0,0,0,.25); animation:up .25s ease-out; }
@keyframes up{ from{transform:translateY(40px);opacity:.4} to{transform:none;opacity:1} }
.sheetHead{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
.sheetHead h2{ font-size:28px; margin:0; color:#d82a6c; font-weight:400; }
.xbtn{ width:40px; height:40px; border-radius:50%; border:3px solid #fff; background:linear-gradient(180deg,#ff8fc1,#e0306f); color:#fff; font:400 18px var(--font);
  cursor:pointer; box-shadow:0 3px 8px rgba(150,40,110,.3); }
.pop{ position:absolute; inset:0; background:rgba(60,10,50,.5); display:flex; align-items:center; justify-content:center; padding:20px; z-index:5; }
.popCard{ position:relative; width:100%; max-width:340px; background:linear-gradient(180deg,#fff,#ffeef6); border:5px solid #fff; border-radius:30px;
  padding:58px 20px 22px; text-align:center; color:#5a1a4a; box-shadow:0 18px 40px rgba(80,10,60,.45); animation:popin .3s cubic-bezier(.3,1.5,.5,1); }
.popTitle{ position:absolute; top:-26px; left:50%; transform:translateX(-50%); background:linear-gradient(180deg,#ff7ab8,#e0306f); color:#fff; border:4px solid #fff;
  border-radius:20px; padding:6px 26px; font-size:28px; white-space:nowrap; box-shadow:0 6px 14px rgba(150,40,110,.4); }
.popTitle.world{ background:linear-gradient(180deg,#b884ff,#6a1b9a); }
.popCard .xbtn{ position:absolute; top:-14px; right:-12px; }
.popStars{ font-size:42px; color:#ffc21a; letter-spacing:6px; text-shadow:0 3px 0 #b86e00; margin-bottom:6px; }
.popStars .off{ color:#e8d6e2; text-shadow:none; }
.bossBox{ display:flex; gap:12px; align-items:center; background:#fff; border-radius:18px; padding:10px 12px; text-align:left; box-shadow:inset 0 0 0 2px #ffd3e7; }
.bossBox .bi{ width:56px; height:56px; border-radius:50%; background:#30364f; display:flex; align-items:center; justify-content:center; font-size:30px; flex:none; border:3px solid #ffd3e7; }
.bossBox.world .bi{ background:#5a1a8a; border-color:#ffc21a; }
.bossBox b{ display:block; font-weight:400; font-size:17px; color:#3a1a3a; }
.bossBox small{ display:block; font-family:system-ui; font-size:12.5px; color:#8a5a7a; margin-top:2px; }
.popCard p{ font-family:system-ui; font-size:13px; color:#8a5a7a; margin:12px 0 4px; line-height:1.4; }
.popCard .play{ margin-top:12px; width:100%; background:linear-gradient(180deg,#7ee36a,#2fb34b); box-shadow:0 6px 0 #1f8a37,0 10px 20px rgba(0,0,0,.2); }
.popCard .play:active{ box-shadow:0 2px 0 #1f8a37; }
@media (min-width:600px){ .sidebtns{ left:calc(50% - 280px - 80px); } }
@media (prefers-reduced-motion: reduce){ .mapwrap .pin,.mapwrap .burst,.mapwrap .newnode,.mapwrap .pulse{ animation:none; } }
@media (prefers-reduced-motion: reduce){ .chest{ animation:none; } .map .pulse{ animation:none; } }

/* =========================================================
   IDENTIDADE VISUAL · "Campanha de brinquedo"
   Soldadinhos de plástico, mapa de missão e medalhas.
   Traço: contorno grosso cor de tinta + sombra dura deslocada (como brinquedo/adesivo).
   ========================================================= */
:root{
  /* cores base */
  --c-ink:#1F2A1C;          /* tinta: textos e contornos */
  --c-olive-900:#26351F;    /* fundo de base, barras */
  --c-olive-700:#3F5A2B;    /* faixas, botões secundários */
  --c-olive-500:#6B8A3A;    /* progresso, fases vencidas */
  --c-olive-300:#A9BE7B;
  --c-khaki-50:#FBF7EC;     /* papel claro: cartões */
  --c-khaki-100:#F3ECD8;    /* papel */
  --c-khaki-200:#E6DABA;    /* papel escuro, bordas internas */
  --c-khaki-400:#B9A982;    /* texto secundário, trancado */
  --c-brass:#F0B429;        /* latão: estrelas, medalhas, moedas */
  --c-brass-dark:#A86F06;
  --c-signal:#FF6B2C;       /* laranja de sinalização: ação principal */
  --c-signal-dark:#B93D0B;
  --c-navy:#1E3A5F;         /* exército do jogador, chefões do mundo */
  --c-red:#D63B2F;          /* perigo */
  --c-blue:#2F74D0;         /* portões bons */
  /* tipografia */
  --f-display:"Black Ops One","Arial Black",Impact,sans-serif;  /* títulos, números, carimbos */
  --f-ui:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;  /* interface e textos */
  /* forma */
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --line:3px solid var(--c-ink);
  --hard:0 4px 0 rgba(31,42,28,.85);
  --hard-sm:0 3px 0 rgba(31,42,28,.8);
  /* mapeamento dos tokens antigos */
  --panel:var(--c-khaki-50); --panel2:var(--c-khaki-100); --ink:var(--c-ink); --muted:#5E6B4E;
  --good:var(--c-navy); --bad:var(--c-red); --gold:var(--c-brass); --font:var(--f-ui);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --panel:#2C3B24; --panel2:#35472B; --ink:#F3ECD8; --muted:#C9BC98; }
}
:root[data-theme="dark"]{ --panel:#2C3B24; --panel2:#35472B; --ink:#F3ECD8; --muted:#C9BC98; }
html,body{ font-family:var(--f-ui); font-weight:700; }

#bossBar>i{ background:linear-gradient(90deg,var(--c-red),var(--c-signal)); }
.wchip .bar>i{ background:linear-gradient(90deg,var(--c-brass-dark),var(--c-brass)); }
#armyLabel{ background:var(--c-navy); border:3px solid var(--c-khaki-50); font-family:var(--f-display); box-shadow:0 3px 0 var(--c-ink); }
#toast{ font-family:var(--f-display);
  text-shadow:3px 3px 0 var(--c-ink),-3px -3px 0 var(--c-ink),3px -3px 0 var(--c-ink),-3px 3px 0 var(--c-ink),0 3px 0 var(--c-ink),0 -3px 0 var(--c-ink),0 8px 0 rgba(31,42,28,.4); }
#hint{ font-family:var(--f-display); text-shadow:0 3px 0 var(--c-ink); }

#ultBtn.ready span{ background:linear-gradient(180deg,#FF9A5C,var(--c-signal)); }

/* ---------- cartões, botões e listas ---------- */
.overlay{ background:rgba(31,42,28,.55); }

/* ---------- tela do mapa ---------- */
.home{ background-color:var(--c-olive-900);

.avatar{ border:var(--line); background:radial-gradient(circle at 35% 30%,#FFE08A,var(--c-brass) 60%,var(--c-brass-dark)); box-shadow:var(--hard); }
.avatar b{ background:var(--c-signal); border:2px solid var(--c-ink); font-family:var(--f-display); font-weight:400; }
.cpill{ background:var(--c-khaki-50); border:var(--line); color:var(--c-ink); box-shadow:var(--hard); font-family:var(--f-ui); font-weight:900; }
.gear{ border:var(--line); background:var(--c-olive-700); box-shadow:var(--hard); }
.worldpill{ background:var(--c-ink); color:var(--c-khaki-50); border:3px solid var(--c-brass); font-family:var(--f-display); font-weight:400; box-shadow:var(--hard); }
.sbtn{ border:var(--line); background:var(--c-khaki-50); box-shadow:var(--hard); color:var(--c-ink); border-radius:var(--r-md); }
.sbtn small{ font-family:var(--f-ui); font-weight:800; }
.dotb{ background:var(--c-red); border:2px solid var(--c-ink); font-family:var(--f-ui); font-weight:800; }
.bottomnav{ background:var(--c-olive-900); border-top:3px solid var(--c-brass); box-shadow:0 -4px 0 rgba(31,42,28,.6); }
.nb{ color:var(--c-khaki-200); font-family:var(--f-ui); font-weight:800; }
.nb.on{ background:var(--c-olive-700); color:var(--c-brass); box-shadow:inset 0 0 0 2px var(--c-brass); }
.sheet,.pop{ background:rgba(20,28,18,.6); }
.sheetCard{ border:4px solid var(--c-ink); border-bottom:none; box-shadow:0 -6px 0 rgba(31,42,28,.5); }
.sheetHead h2{ font-family:var(--f-display); font-weight:400; color:var(--ink); }
.xbtn{ border:var(--line); background:var(--c-khaki-200); color:var(--c-ink); font-family:var(--f-ui); font-weight:900; box-shadow:var(--hard-sm); }

.popTitle{ background:var(--c-olive-700); color:var(--c-khaki-50); border:var(--line); font-family:var(--f-display); font-weight:400; box-shadow:var(--hard); }
.popTitle.world{ background:var(--c-navy); border-color:var(--c-ink); box-shadow:var(--hard),0 0 0 3px var(--c-brass) inset; }
.popStars{ color:var(--c-brass); text-shadow:0 3px 0 var(--c-brass-dark); }
.popStars .off{ color:#D6C597; text-shadow:0 3px 0 var(--c-khaki-400); }
.bossBox{ background:var(--c-khaki-100); border:2px solid var(--c-ink); box-shadow:none; }
.bossBox .bi{ background:var(--c-ink); border:3px solid var(--c-khaki-200); }
.bossBox.world .bi{ background:var(--c-navy); border-color:var(--c-brass); }
.bossBox b{ font-family:var(--f-ui); font-weight:800; color:var(--c-ink); }
.bossBox small,.popCard p{ font-family:var(--f-ui); font-weight:500; color:#5E6B4E; }
.popCard .play{ background:linear-gradient(180deg,#FF9A5C,var(--c-signal)); box-shadow:0 6px 0 var(--c-signal-dark),0 6px 0 3px var(--c-ink); }
.popCard .play:active{ box-shadow:0 2px 0 var(--c-signal-dark),0 2px 0 3px var(--c-ink); }
.chest{ filter:drop-shadow(0 4px 0 rgba(31,42,28,.6)); }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const FONT='"Black Ops One","Arial Black",sans-serif';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let seed=1;
const rng=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
const rand=(a,b)=>a+rng()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.floor(rng()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ================= Dados do jogo ================= */

    passive:'Perde menos soldados no corpo a corpo',ult:'Escudo: 6 s sem perdas'},
  atiradora:{name:'Atiradora',color:0xb04dff,hat:0x4a1475,price:800,icon:'⚡',
    passive:'+25% de cadência',ult:'Fúria: tiro 3× mais rápido por 6 s'}
};
const HERO_IDS=Object.keys(HEROES);
const UPGRADES=[
  {id:'start',name:'Recrutas',desc:'+3 soldados no início',base:40,mul:1.55},
  {id:'dmg',name:'Munição',desc:'+15% de dano',base:60,mul:1.6},
  {id:'rate',name:'Gatilho',desc:'+12% de cadência',base:60,mul:1.6},
  {id:'income',name:'Cofre',desc:'+15% de moedas',base:80,mul:1.7}
];
const UP_MAX=15;
function brutePower(){return 2*Math.pow(1+.15*P.up.dmg,.5);}
function powerFactor(){return Math.pow((1+.15*P.up.dmg)*(1+.12*P.up.rate),.85)*(1+.03*P.up.start)*(P.hero==='artilheiro'||P.hero==='atiradora'?1.1:1);}
function armyFactor(){return 1+.035*P.up.start+.02*(P.up.dmg+P.up.rate);}
function startCount(){return 10+P.up.start*3+(P.hero==='comandante'?5:0);}
let curSegI=0;
function expArmy(lv,i){return Math.min(ARMY_CAP,startCount()+Math.ceil(i/2)*(10+lv*3)*.75);}
function dpsEst(E){return Math.min(14,Math.ceil(E/4))/.45*(1+.15*P.up.dmg)*(1+.12*P.up.rate);}
const curLv=()=>S.endless?sectorLv(S.armyZ):S.level;
const upCost=u=>Math.round(u.base*Math.pow(u.mul,P.up[u.id]));
const WEAPONS=[
  {name:'Pistola',color:0xffe14d},{name:'Rifle',color:0xff9f1c},{name:'Metralhadora',color:0x3de0ff},

];
const BIOMES=[
  {key:'campo',name:'Campo',sky:0x9fd4ff,ground:0x74c365,road:['#5b6580','#636e8b'],rail:0xff7a3d,deco:'trees',light:.85},
  {key:'cidade',name:'Cidade',sky:0xbcd9f2,ground:0x8d96a8,road:['#444b60','#4c546b'],rail:0xffd23d,deco:'buildings',light:.85},

  {key:'vulcao',name:'Vulcão',sky:0x5a2433,ground:0x3b2a2a,road:['#3d3540','#463d49'],rail:0xff5a1f,deco:'rocks',light:.7},
  {key:'outono',name:'Outono',sky:0xffd2a8,ground:0xc99a48,road:['#6a5a52','#73635a'],rail:0xd9481c,deco:'round',hue:[.02,.12],sat:.78,lit:[.45,.58],light:.88},
  {key:'praia',name:'Praia',sky:0x86dcff,ground:0xd9bd7c,road:['#8a7a6a','#948474'],rail:0x1fa2ff,deco:'palms',light:.92},
  {key:'selva',name:'Selva',sky:0xa8dfb6,ground:0x3f8a3a,road:['#5a4a3a','#644f3e'],rail:0x8a5a33,deco:'round',hue:[.24,.36],sat:.55,lit:[.2,.32],big:1.7,bushes:true,light:.8},
  {key:'sakura',name:'Cerejeiras',sky:0xffd6ea,ground:0x9fd48a,road:['#7a6a7a','#847484'],rail:0xff6fb5,deco:'round',hue:[.9,.97],sat:.65,lit:[.74,.84],light:.9}
];
/* Cada mundo (5 fases) sorteia 5 cenários diferentes entre os 9, sem repetir na virada de um mundo para o outro.
   O sorteio é fixo por mundo, então o mapa e a fase sempre combinam. */
const biomeCache={};
function biomeOf(lv){
  if(lv<1)return 0;
  const w=Math.floor((lv-1)/5);
  if(!biomeCache[w]){
    let sd=w*9973+12345;const r=()=>{sd=(sd*16807)%2147483647;return sd/2147483647;};
    const prev=w>0?biomeOf(w*5):-1;let order;
    for(let t=0;t<20;t++){
      order=BIOMES.map((_,i)=>i);
      for(let i=order.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
      order=order.slice(0,5);if(order[0]!==prev)break;
    }
    if(w===0)order=[0].concat(order.filter(x=>x!==0)).slice(0,5);
    biomeCache[w]=order;
  }
  return biomeCache[w][(lv-1)%5];
}

  {id:'esqueleto',name:'Rei Esqueleto',icon:'💀',head:'crown',body:0xeae2d0,dark:0x6b5d4a,eye:0x6dfcff,attacks:['summon','smash'],scale:1.85,hpMul:1.1,
    power:'Invoca tropas'},
  {id:'mago',name:'Mago das Sombras',icon:'🧙',head:'wizard',body:0x3b2a7a,dark:0x1e1440,eye:0x8ff0ff,attacks:['lightning','summon'],scale:1.85,hpMul:1.05,
    power:'Raios nas faixas marcadas'},
  {id:'golem',name:'Golem de Lava',icon:'🗿',head:'lava',body:0x4a3b38,dark:0x2a201e,eye:0xff7a1a,attacks:['rockets','smash'],scale:2.2,hpMul:1.25,
    power:'Bolas de fogo e pancadas'},

function updTowers(dt){
  for(const k of blocks){
    if(!k.alive)continue;
    if(k.type==='mine'){k.led.material=Math.sin(T*8+k.x)>0?glowMat(0xff2d2d):glowMat(0x551010);continue;}
    if(k.type!=='tank')continue;
    k.turret.rotation.y=Math.atan2(S.armyX-k.x,S.armyZ-k.z);
    if(S.mode!=='run'||k.z<S.armyZ-60)continue;
    if(k.z<S.armyZ-3){k.z+=k.vz*dt;k.mesh.position.z=k.z;k.label.s.position.z=k.z;}
    if(k.z>S.armyZ-3||k.z<S.armyZ-42)continue;
    k.fireT-=dt;
    if(k.fireT<=0){
      k.fireT=Math.max(1.4,2.6-curLv()*.05);
      launchRocket(k.x,k.z+1.5,S.armyX+rand(-1,1),S.armyZ-S.speed*1.35+rand(-1,1),false,{fy:2});
      fx(k.x+Math.sin(k.turret.rotation.y)*2.6,1.5,k.z+Math.cos(k.turret.rotation.y)*2.6,0xff8a2a,1.6,.12);SFX.cannon();
    }
  }

  for(const k of blocks){
    if(k.type!=='tower'||!k.alive)continue;
    k.turret.rotation.y=Math.atan2(S.armyX-k.x,S.armyZ-k.z);
    if(S.mode!=='run'||k.z>S.armyZ-3||k.z<S.armyZ-40)continue;
    k.fireT-=dt;
    if(k.fireT<=0){
      k.fireT=Math.max(1.5,2.8-curLv()*.06);
      const lead=S.speed*1.35;
      launchRocket(k.x,k.z+.8,S.armyX+rand(-1.2,1.2),S.armyZ-lead+rand(-1,1),false,{fy:4.5});
      fx(k.x,4.1,k.z+1.3,0xff5a1f,1.4,.12);SFX.cannon();
    }
  }
}

function instanced(geo,mat,n,place){
  const m=new THREE.InstancedMesh(geo,mat,n);const c=new THREE.Color();let colored=false;
  for(let i=0;i<n;i++){dummy.position.set(0,0,0);dummy.rotation.set(0,0,0);dummy.scale.set(1,1,1);
    const col=place(i,dummy,c);dummy.updateMatrix();m.setMatrixAt(i,dummy.matrix);if(col){m.setColorAt(i,col);colored=true;}}
  if(colored&&m.instanceColor)m.instanceColor.needsUpdate=true;
  host.add(m);return m;
}

  fx(x,1.2,z,0xff8a1f,4,.45,1.4);fx(x,1.5,z,0xffe14d,2.5,.25,1);S.shake=Math.max(S.shake,.4);SFX.boom();vib(60);
  const RAD=4.5,dmg=40+curLv()*12;
  for(const g of groups)if(g.alive&&Math.hypot(g.x-x,g.z-z)<RAD+gR(g))damageGroup(g,dmg);
  for(const k of blocks)if(k.alive&&Math.hypot(k.x-x,k.z-z)<RAD)damageBlock(k,dmg);

function mineBlast(x,z,byPlayer){
  burst(x,.5,z,0xff5a1f,16,1.4);fx(x,.8,z,0xff8a1f,3,.35,1.2);SFX.boom(.6);S.shake=Math.max(S.shake,.3);
  for(const g of groups)if(g.alive&&Math.hypot(g.x-x,g.z-z)<2.6+gR(g))damageGroup(g,20+curLv()*6);
  if(!byPlayer&&S.shieldT<=0){const n=killInRadius(x,z,2.3,Math.max(3,Math.ceil(S.count*.12)));if(n){toast('−'+n,'#ff3b55');vib(60);}}
}
function hitBoss(d){
  if(boss.shieldOn>0){if(Math.random()<.15)fx(boss.x+rand(-3,3),rand(2,6),boss.z+3,0x7fd0ff,1,.12);return;}
  boss.hp-=d;boss.flash=.07;S.ult=Math.min(100,S.ult+.05);
  if(boss.hp<=0){boss.hp=0;bossDie();return;}
  if(boss.world){
    if(boss.phase===1&&boss.hp<boss.maxHp*.66){boss.phase=2;enterPhase2();}
    else if(boss.phase===2&&boss.hp<boss.maxHp*.33){boss.phase=3;enterPhase3();}
  }else if(!boss.phase2&&boss.hp<boss.maxHp*.5)enterPhase2();
}
function enterPhase3(){
  const b=boss;b.spd=2.4;b.rateMul=.55;b.smashP=.9;
  const extra=['lightning','wave','summon'].find(a=>!b.atk.includes(a));if(extra)b.atk.push(extra);
  b.g.scale.multiplyScalar(1.08);b.halfW*=1.08;b.reach*=1.08;
  $('bossName').textContent='👑 '+b.def.name+' · fase final';
  toast('Fase final!','#ff3b55');SFX.roar();vib([200,80,200,80,200]);S.shake=1;
  burst(b.x,5,b.z,0xffc21a,36,1.8);fx(b.x,4,b.z,0xffc21a,10,.7,1.2);
}
function enterPhase2(){
  const b=boss;b.phase2=true;b.spd=2.1;b.rateMul=.65;b.smashP=.95;
  if(!b.atk.includes('rockets'))b.atk.push('rockets');
  if(!b.atk.includes('summon')&&curLv()>=3)b.atk.push('summon');
  b.g.scale.multiplyScalar(1.12);b.halfW*=1.12;b.reach*=1.12;
  $('bossName').textContent=(b.world?'👑 ':'')+b.def.name+' · fúria';
  toast('Fúria do chefão!','#ff3b55');SFX.roar();vib([150,80,150]);S.shake=.8;
  burst(b.x,4,b.z,0xff3b30,26,1.6);fx(b.x,4,b.z,0xff3b30,8,.6,1);
}

function updateArmyLabel(){const el=$('armyLabel');el.textContent=S.count>=ARMY_CAP?S.count+' máx':S.count;el.style.background=S.count>=ARMY_CAP?'#ff9d00':'';}
function setCount(n,silent){
  const prev=S.count;
  if(n>ARMY_CAP&&prev<ARMY_CAP+1&&S.mode!=='menu')banner('Exército no limite de '+ARMY_CAP+' soldados');
  S.count=clamp(Math.floor(n),0,ARMY_CAP);
  if(S.count<prev&&!silent)burst(S.armyX,.6,S.armyZ-armyR()*.6,0x2f7bff,Math.min(6,prev-S.count));
  updateArmyLabel();
  if(S.count<=0&&(S.mode==='run'||S.mode==='boss'))gameOver();
}
function killSoldierAt(i){
  if(S.shieldT>0||i>=shown)return false;
  burst(sx[i],.5,sz[i],0x2f7bff,3);SFX.hurt();
  const last=shown-1;sx[i]=sx[last];sz[i]=sz[last];shown=last;
  setCount(S.count-1,true);return true;
}
function killInRadius(x,z,r,max){
  let n=0;max=max||1e9;
  for(let i=shown-1;i>=0&&n<max;i--){const dx=sx[i]-x,dz=sz[i]-z;if(dx*dx+dz*dz<r*r&&killSoldierAt(i))n++;if(S.count<=0)break;}
  return n;
}

  S.ult=0;lastUlt=-1;const h=heroId();SFX.ult();vib(60);stat('ults',1);
  if(h==='comandante'){const add=Math.max(10,Math.round(S.count*.5));setCount(S.count+add,true);toast('Reforços +'+add,'#2f7bff');burst(S.armyX,1,S.armyZ,0x2f7bff,20);}
  else if(h==='guardiao'){S.shieldT=6;toast('Escudo!','#2fa8ff');}
  else if(h==='atiradora'){S.furyT=6;toast('Fúria!','#b04dff');}
  else{
    toast('Chuva de mísseis!','#ff8a1f');
    const dmg=60+curLv()*20;let n=0;
    for(const g of groups){if(g.alive&&g.z<S.armyZ+2&&g.z>S.armyZ-70&&n<14){launchRocket(S.armyX,S.armyZ+4,g.x,g.z,true,{group:g,dmg:dmg*(g.kind==='brute'?1.5:1)});n++;}}
    for(const k of blocks){if(k.alive&&k.z<S.armyZ&&k.z>S.armyZ-60&&n<18){launchRocket(S.armyX,S.armyZ+4,k.x,k.z,true,{block:k,dmg});n++;}}
    if(S.mode==='boss'&&boss&&boss.alive)for(let i=0;i<6;i++)launchRocket(S.armyX,S.armyZ+4,boss.x+rand(-1,1),boss.z+1,true,{boss:true,dmg:boss.maxHp*.035});
  }
}
const rocketGeo=new THREE.SphereGeometry(.35,10,8);
const ringGeo=new THREE.RingGeometry(.8,1.05,32);ringGeo.rotateX(-Math.PI/2);
function launchRocket(fx,fz,tx,tz,friendly,info){
  const m=new THREE.Mesh(rocketGeo,new THREE.MeshBasicMaterial({color:friendly?0xffb300:(boss&&boss.def.head==='lava'?0xff5a1f:0xff2d2d)}));
  m.position.set(fx,info&&info.fy||(friendly?12:8),fz);levelGroup.add(m);
  let ring=null;
  if(!friendly){ring=new THREE.Mesh(ringGeo,new THREE.MeshBasicMaterial({color:0xff2d2d,transparent:true,opacity:.8,depthWrite:false}));ring.position.set(tx,.05,tz);levelGroup.add(ring);}
  rockets.push({m,ring,fx,fy:m.position.y,fz,tx,tz,t:0,dur:friendly?.7+Math.random()*.3:1.35,friendly,info:info||{}});
}
function updRockets(dt){
  for(const r of rockets.slice()){
    if(rockets.indexOf(r)<0)continue;r.t+=dt;const u=Math.min(1,r.t/r.dur);
    if(r.info.group&&r.info.group.alive){r.tx=r.info.group.x;r.tz=r.info.group.z;}
    r.m.position.set(r.fx+(r.tx-r.fx)*u,r.fy*(1-u)+Math.sin(Math.PI*u)*5,r.fz+(r.tz-r.fz)*u);
    if(r.ring){const s=1+Math.sin(T*14)*.08;r.ring.scale.set(s,1,s);}
    if(u>=1){
      burst(r.tx,.4,r.tz,r.friendly?0xffb300:0xff5a1f,12,1.3);fx(r.tx,.8,r.tz,r.friendly?0xffb300:0xff5a1f,3,.3,1);
      if(r.friendly){
        if(r.info.group&&r.info.group.alive)damageGroup(r.info.group,r.info.dmg);
        if(r.info.block&&r.info.block.alive)damageBlock(r.info.block,r.info.dmg);
        if(r.info.boss&&boss&&boss.alive)hitBoss(r.info.dmg);
      }else if(S.mode==='boss'||S.mode==='run'){S.shake=Math.max(S.shake,.25);SFX.boom(.5);vib(40);killInRadius(r.tx,r.tz,.95,Math.max(2,Math.ceil(S.count*.045)));}
      r.m.visible=false;if(r.ring)r.ring.visible=false;const ix=rockets.indexOf(r);if(ix>=0)rockets.splice(ix,1);
    }
  }
}

/* ================= Lógica da pista ================= */
function applyOpt(o){
  if(o.k==='wpn'){
    if(o.stat==='dmg')S.dmgB++;else if(o.stat==='rate')S.rateB++;else S.rangeB++;
    toast(WPN_LABEL[o.stat]+' +1','#ff9d00');SFX.power();stat('gates',1);updateHUD();return;
  }
  let n=S.count;
  if(o.op==='+')n+=o.v;else if(o.op==='-')n-=o.v;else if(o.op==='x')n*=o.v;else n=Math.floor(n/o.v);
  toast(opText(o),isGood(o)?'#2f7bff':'#ff3b55');
  if(isGood(o)){SFX.good();stat('gates',1);}else{SFX.bad();vib(45);}
  setCount(n,true);
}
function checkRows(R){
  for(const r of rows){
    if(r.used||S.armyZ>r.z)continue;
    r.used=true;
    if(r.type==='gates'){
      const lane=clamp(Math.floor((S.armyX+HALF)/r.w),0,r.lanes-1);
      r.meshes.forEach((q,i)=>{q.m.material.opacity=i===lane?.1:.35;q.sh.visible=false;q.fl.visible=i!==lane;});
      fx(r.meshes[lane].m.position.x,1.8,r.z+.3,GATE_HEX[gateKind(r.opts[lane])],5,.35,.6);
      burst(r.meshes[lane].m.position.x,1.8,r.z,isGood(r.opts[lane])?0x2f7bff:0xff3b55,12);
      applyOpt(r.opts[lane]);
    }else{
      const gx=r.grp.position.x;
      if(Math.abs(S.armyX-gx)<2.1+Math.min(R,2.5)*.5){r.lane.m.material.opacity=.1;r.lane.sh.visible=false;fx(gx,1.8,r.z+.3,0x3d8bff,5,.35,.6);burst(gx,1.8,r.z,0x2f7bff,14);applyOpt(r.opt);}
      else toast('Passou longe!','#7a83a6');
    }
  }
}
function checkBlocks(R){
  const front=S.armyZ-R*.8;
  for(const k of blocks){
    if(!k.alive)continue;
    if(front<=k.z+1&&S.armyZ>=k.z-1.5&&Math.abs(S.armyX-k.x)<R+(k.hw||1.05)-.25){
      if(k.type==='boom'||k.type==='mine'||k.type==='cage'){killBlock(k,false);continue;}
      const loss=S.shieldT>0?0:Math.min(S.count,Math.ceil(k.lossMax*Math.max(0,k.hp)/k.maxHp));
      killBlock(k,false);S.shake=.25;
      if(loss>0){toast('−'+loss,'#ff3b55');SFX.bad();vib(50);setCount(S.count-loss);}
    }
  }
}
function checkPowers(R){
  for(const p of powers){
    if(p.taken)continue;
    if(S.armyZ<=p.z+.8&&S.armyZ>=p.z-1.5&&Math.abs(S.armyX-p.x)<1.2+R*.6){
      p.taken=true;p.grp.visible=false;burst(p.x,1.5,p.z,0xffb300,18);fx(p.x,1.5,p.z,0xffc21a,4,.4,.8);evolve();
    }
  }
}
function checkCoins(R){
  const rr2=Math.pow(R*.85+.6,2);
  for(const c of coins){
    if(c.taken)continue;
    const dx=c.x-S.armyX,dz=c.z-S.armyZ;
    if(dx*dx+dz*dz<rr2){c.taken=true;c.mesh.visible=false;S.coinsRun+=1;SFX.coin();stat('coins',1);burst(c.x,.8,c.z,0xffc21a,3,.6);}
  }
}
function updHazards(dt,active){
  for(const h of hazards){
    if(h.type==='spin'){h.ang+=h.spd*dt;h.obj.rotation.y=h.ang;}
    else{h.x=Math.sin(T*h.spd+h.phase)*(HALF-1.4);h.obj.position.x=h.x;h.obj.rotation.z-=dt*10;}
    if(!active||Math.abs(h.z-S.armyZ)>8)continue;
    for(let i=shown-1;i>=0;i--){
      const px=sx[i],pz=sz[i];let hit=false;
      if(h.type==='spin'){
        const dx=Math.cos(h.ang),dz=-Math.sin(h.ang);
        const rx=px-h.x,rz=pz-h.z;let t=rx*dx+rz*dz;t=clamp(t,-h.len/2,h.len/2);
        const qx=rx-t*dx,qz=rz-t*dz;hit=qx*qx+qz*qz<.12;
      }else hit=Math.abs(pz-h.z)<.35&&Math.abs(px-h.x)<h.r;
      if(hit){if(!killSoldierAt(i))break;S.shake=Math.max(S.shake,.12);if(S.count<=0)return;}
    }
  }
}
function melee(dt,R){
  let hit=false;const front=S.armyZ-R*.8-.2;
  const guard=heroId()==='guardiao'?1.5:1;
  for(const g of groups){
    if(!g.alive||g.passed)continue;const r=gR(g);
    if(S.armyZ<g.z-r-1.5){g.passed=true;continue;}
    if(front<=g.z+r*.8+.2&&Math.abs(S.armyX-g.x)<R+r-.4){
      hit=true;g.engaged=true;S.meleeT+=dt;
      while(S.meleeT>=.05&&g.alive&&S.count>0){
        S.meleeT-=.05;
        const power=(g.kind==='brute'?brutePower():g.unitHp)*guard;
        const eq=Math.ceil(g.hp/power);
        const k=Math.max(1,Math.floor(Math.min(S.count,eq)*.1));
        const kk=Math.min(k,S.count,eq);
        damageGroup(g,kk*power);
        if(S.shieldT<=0)setCount(S.count-kk);
      }
    }
  }
  if(!hit)S.meleeT=0;
  return hit;
}

/* ================= Chefão ================= */
let bfx=[];
const warnMat=()=>new THREE.MeshBasicMaterial({color:0xff2d2d,transparent:true,opacity:.35,depthWrite:false});
function addWarn(cx,w,len,col){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,len),warnMat());if(col)m.material.color.setHex(col);m.rotation.x=-Math.PI/2;m.position.set(cx,.06,S.armyZ);levelGroup.add(m);return m;}
function killBand(x0,x1,max){let n=0;for(let i=shown-1;i>=0&&n<max;i--){if(sx[i]>=x0&&sx[i]<=x1&&killSoldierAt(i))n++;if(S.count<=0)break;}return n;}
const LANES=[-6.75,-2.25,2.25,6.75];
function castLightning(nl){
  const pickL=LANES.slice().sort(()=>Math.random()-.5).slice(0,nl);
  pickL.forEach(x=>bfx.push({type:'bolt',x,t:0,warn:addWarn(x,4.3,16,0x8ff0ff)}));
  SFX.warn();
}
function castBreath(){
  const side=S.armyX>0?1:-1;const cx=side*HALF/2;
  bfx.push({type:'breath',x0:side>0?0:-HALF,x1:side>0?HALF:0,cx,t:0,warn:addWarn(cx,HALF,16,0xff6a1a)});
  toast('Sopro de fogo!','#ff6a1a');SFX.warn();
}
const iceGeo=new THREE.ConeGeometry(.5,2.2,6);
function castWave(){
  const gap=rand(-5.5,5.5),grp=new THREE.Group();
  for(let x=-HALF+.5;x<=HALF-.5;x+=1.05){if(Math.abs(x-gap)<2.4)continue;const c=new THREE.Mesh(iceGeo,glowMat(0xbfe9ff));c.position.set(x,1.1,0);c.rotation.z=(Math.random()-.5)*.3;grp.add(c);}
  const gl=new THREE.Mesh(new THREE.PlaneGeometry(4.6,1.6),new THREE.MeshBasicMaterial({color:0x43e97b,transparent:true,opacity:.45,depthWrite:false}));gl.rotation.x=-Math.PI/2;gl.position.set(gap,.05,0);grp.add(gl);
  grp.position.set(0,0,boss.z+boss.reach+1);levelGroup.add(grp);
  bfx.push({type:'wave',grp,gap,z:grp.position.z,killed:0,max:Math.max(5,Math.ceil(S.count*.22))});
  toast('Muralha de gelo!','#3da5ff');SFX.warn();
}
function updBossFx(dt){
  for(const f of bfx.slice()){
    let done=false;
    if(f.type==='bolt'){
      f.t+=dt;f.warn.material.opacity=.25+Math.abs(Math.sin(f.t*14))*.3;
      if(f.t>=1.1&&!f.hit){f.hit=true;
        for(let k=0;k<4;k++)fx(f.x+rand(-1.5,1.5),rand(1,7),S.armyZ+rand(-4,4),0x8ff0ff,3,.25,.5);
        const bolt=new THREE.Mesh(boxGeo,new THREE.MeshBasicMaterial({color:0xdff8ff,transparent:true,opacity:.9,blending:THREE.AdditiveBlending}));bolt.scale.set(.5,14,.5);bolt.position.set(f.x,7,S.armyZ);levelGroup.add(bolt);f.bolt=bolt;
        S.shake=Math.max(S.shake,.35);SFX.boom(.6);vib(60);
        if(S.shieldT<=0)killBand(f.x-2.15,f.x+2.15,Math.max(3,Math.ceil(S.count*.1)));
      }
      if(f.bolt)f.bolt.material.opacity=Math.max(0,.9-(f.t-1.1)*4);
      if(f.t>1.4)done=true;
    }else if(f.type==='breath'){
      f.t+=dt;
      if(f.t<.9)f.warn.material.opacity=.2+Math.abs(Math.sin(f.t*12))*.3;
      else{
        f.warn.material.opacity=.45;f.warn.material.color.setHex(0xff8a1a);
        f.tick=(f.tick||0)+dt;
        for(let k=0;k<3;k++)fx(rand(f.x0,f.x1),rand(.3,2.2),S.armyZ+rand(-5,5),Math.random()<.5?0xff6a1a:0xffd23d,rand(1.2,2.4),.3,.6);
        if(f.tick>.16){f.tick=0;if(S.shieldT<=0)killBand(f.x0,f.x1,Math.max(1,Math.ceil(S.count*.04)));SFX.hurt();}
        if(f.t>2.4)done=true;
      }
    }else if(f.type==='wave'){
      f.z+=9*dt;f.grp.position.z=f.z;
      for(let i=shown-1;i>=0&&f.killed<f.max;i--){if(Math.abs(sz[i]-f.z)<.5&&Math.abs(sx[i]-f.gap)>2.3&&killSoldierAt(i))f.killed++;if(S.count<=0)break;}
      if(f.z>S.armyZ+14)done=true;
    }
    if(done){if(f.warn){levelGroup.remove(f.warn);f.warn.geometry.dispose();f.warn.material.dispose();}
      if(f.bolt){levelGroup.remove(f.bolt);f.bolt.material.dispose();}
      if(f.grp){levelGroup.remove(f.grp);}
      bfx.splice(bfx.indexOf(f),1);}
  }
}
function clearBossFx(){for(const f of bfx){if(f.warn)levelGroup.remove(f.warn);if(f.bolt)levelGroup.remove(f.bolt);if(f.grp)levelGroup.remove(f.grp);}bfx=[];}
function startBoss(){
  S.mode='boss';$('bossWrap').style.display='block';$('bossName').textContent=(boss.world?'👑 ':'')+boss.def.name;
  toast(boss.def.name+'!','#ff3b55');setTrack(boss.world?'world':'boss');SFX.roar();vib(200);
  banner((boss.world?'Chefão do mundo · ':'')+boss.def.power);
}
function updBoss(dt,R){
  const b=boss;if(!b||!b.alive)return;
  const lv=curLv(),atk=b.atk,smash=atk.includes('smash');
  b.x+=(S.armyX*.5-b.x)*Math.min(1,dt*.8);b.g.position.x=b.x;
  const front=S.armyZ-R*.8-.3,bf=b.z+b.reach;
  const keep=smash?0:10;
  if(bf<front-.2-keep){
    b.z+=b.spd*dt;b.g.position.z=b.z;const w=Math.sin(T*(b.phase2?8:5));
    b.legL.rotation.x=w*.5;b.legR.rotation.x=-w*.5;
    if(!b.attacking){b.armL.rotation.x=-w*.4;b.armR.rotation.x=w*.4;}
    b.smashT=0;
  }else if(smash){
    b.legL.rotation.x*=.9;b.legR.rotation.x*=.9;b.smashT+=dt;
    const t=b.smashT/b.smashP*1.2,ang=t<1?.3+2.3*t:2.6-2.4*Math.min(1,(t-1)/.15);
    b.armL.rotation.x=b.armR.rotation.x=-ang;
    if(b.smashT>=b.smashP){

const keys={left:false,right:false};
let T=0,last=performance.now();
function update(dt){
  const active=S.mode==='run'||S.mode==='boss';
  if(active){
    if(keys.left)S.targetX-=dt*12;if(keys.right)S.targetX+=dt*12;
    S.targetX=clamp(S.targetX,-HALF+.4,HALF-.4);
    let R=armyR();const lim=Math.max(0,HALF-.4-R);
    S.armyX+=(clamp(S.targetX,-lim,lim)-S.armyX)*Math.min(1,dt*10);
    S.shieldT=Math.max(0,S.shieldT-dt);S.furyT=Math.max(0,S.furyT-dt);
    for(const g of groups){if(g.alive&&g.charge&&!g.vz&&g.z>S.armyZ-42&&g.z<S.armyZ){g.vz=7.5;SFX.warn();}if(g.alive&&g.vz&&!g.engaged){g.z+=g.vz*dt;}}
    const inMelee=melee(dt,R);
    if(S.mode==='run'){
      S.armyZ-=S.speed*(inMelee?.15:1)*dt;
      if(S.endless){
        S.dist=-S.armyZ;S.speed=Math.min(20,13+S.dist/450);streamEndless();
        E.pruneT-=dt;if(E.pruneT<=0){E.pruneT=1;pruneEndless();}
        if(boss&&boss.alive&&S.armyZ<=stopZ){S.armyZ=stopZ;startBoss();}
      }else if(S.armyZ<=stopZ){S.armyZ=stopZ;startBoss();}
      shooterFire(dt);
      R=armyR();checkRows(R);checkBlocks(R);checkPowers(R);checkCoins(R);
    }
    if(S.count>S.maxCount)S.maxCount=S.count;
    updHazards(dt,S.mode==='run');updTowers(dt);
    if(S.mode==='run'||S.mode==='boss'){
      S.fireT-=dt;if(S.fireT<-1)S.fireT=0;
      if(S.fireT<=0){S.fireT+=fireInterval();fire();}
    }
    if(S.mode==='boss'){updBoss(dt,armyR());updBossFx(dt);}
    if(S.endless){$('distTxt').textContent=Math.floor(S.dist)+' m';$('progBar').querySelector('i').style.width=(boss&&boss.alive?100:clamp((S.armyZ-E.lastBossZ)/(E.nextBossZ-E.lastBossZ),0,1)*100)+'%';}
    else $('progBar').querySelector('i').style.width=(clamp(S.armyZ/stopZ,0,1)*100)+'%';
  }else{
    updHazards(dt,false);
    if(S.mode==='bossdeath'){
      boss.deathT+=dt;const t=boss.deathT;
      boss.g.rotation.x=-Math.min(1,t/1.2)*Math.PI/2;
      boss.g.position.y=-Math.max(0,t-1.2)*2;
      if(Math.random()<.2)burst(boss.x+(Math.random()-.5)*5,Math.random()*4+1,boss.z-Math.random()*4,0xffe14d,3);
      if(t>2.3){if(S.endless)resumeEndless();else win();}
    }
  }
  updEnemyBullets(dt,armyR());updRockets(dt);updBullets(dt);updParts(dt);updFx(dt);updSky(dt);updSoldiers(dt);updFoes(dt);updCam(dt,false);placeLabel();
  if(active)updHudFrame();
}

let menuTab='play';const NET={db:null,user:null,me:null,rows:[],names:{},ready:false};
let netBusy=false;
async function netInit(){
  const cl=window.claude;
  if(!cl||typeof cl.use!=='function'){NET.ready=true;if(menuTab==='rank')renderMenu();return;}
  try{
    const res=await Promise.all([cl.use('db'),cl.use('user')]);
    NET.db=res[0];NET.user=res[1];
    if(NET.user){try{NET.me=await NET.user.id();}catch(e){}}
    if(NET.db){
      NET.db.collection('scores').onSnapshot(snap=>{
        NET.rows=snap.docs.filter(d=>d.exists).map(d=>Object.assign({id:d.id},d.data()));
        resolveNames();
        if(sheetTab==='rank'&&!$('menu').classList.contains('hidden'))renderSheet();
      },()=>{});
    }
  }catch(e){}
  NET.ready=true;if(sheetTab==='rank'&&!$('menu').classList.contains('hidden'))renderSheet();
  netSubmit();
}
async function resolveNames(){
  if(!NET.user)return;
  const ids=NET.rows.map(r=>r.id).filter(id=>!(id in NET.names));
  if(ids.length){try{const ps=await NET.user.profiles(ids);ids.forEach(id=>{NET.names[id]=(ps[id]&&ps[id].name)||'';});}catch(e){}}
  fillNames();
}
function fillNames(){document.querySelectorAll('[data-uid]').forEach(el=>{const id=el.dataset.uid;if(id!==NET.me)el.textContent=NET.names[id]||'Jogador';});}
async function netSubmit(){
  if(!NET.db||!NET.me||netBusy)return;
  const lvl=P.level-1,end=P.endlessBest,cur=NET.rows.find(r=>r.id===NET.me)||{};
  if((cur.level||0)>=lvl&&(cur.endless||0)>=end)return;
  netBusy=true;
  try{await NET.db.doc('scores/'+NET.me).set({level:Math.max(lvl,cur.level||0),endless:Math.max(end,cur.endless||0),hero:P.hero,skin:P.skin,at:Date.now()});}catch(e){}
  netBusy=false;
}

function mapSegs(p){
  const out=[];
  for(let i=0;i<p.length-1;i++){
    const p0=p[Math.max(0,i-1)],p1=p[i],p2=p[i+1],p3=p[Math.min(p.length-1,i+2)];
    out.push(' C'+f1(p1.x+(p2.x-p0.x)/6)+','+f1(p1.y+(p2.y-p0.y)/6)+' '+f1(p2.x-(p3.x-p1.x)/6)+','+f1(p2.y-(p3.y-p1.y)/6)+' '+f1(p2.x)+','+f1(p2.y));
  }
  return out;
}

  let gnd='',sky='';
  for(let i=1;i<=last;i++){const b=biomeOf(i),o=f1((H-mvPos(i,H).y)/H*100)+'%';gnd+='<stop offset="'+o+'" stop-color="'+MAP_GND[b]+'"/>';sky+='<stop offset="'+o+'" stop-color="'+MAP_HILL[b]+'"/>';}
  let h='<svg viewBox="0 0 '+MV_W+' '+H+'" font-family="Rubik, system-ui, sans-serif" font-weight="800">';
  h+='<defs><linearGradient id="vG" gradientUnits="userSpaceOnUse" x1="0" y1="'+H+'" x2="0" y2="0">'+gnd+'</linearGradient>'+
     '<linearGradient id="vH" gradientUnits="userSpaceOnUse" x1="0" y1="'+H+'" x2="0" y2="0">'+sky+'</linearGradient>'+
     [['#B7D45A','#6B8A3A','#3F5A2B'],['#B7D45A','#6B8A3A','#3F5A2B'],['#B7D45A','#6B8A3A','#3F5A2B'],['#B7D45A','#6B8A3A','#3F5A2B'],['#B7D45A','#6B8A3A','#3F5A2B']].map((c,k)=>'<radialGradient id="gD'+k+'" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="'+c[0]+'"/><stop offset=".6" stop-color="'+c[1]+'"/><stop offset="1" stop-color="'+c[2]+'"/></radialGradient>').join('')+
     '<radialGradient id="gC" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#FFC08F"/><stop offset=".6" stop-color="#FF6B2C"/><stop offset="1" stop-color="#B93D0B"/></radialGradient>'+
     '<linearGradient id="gRim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE08A"/><stop offset=".5" stop-color="#F0B429"/><stop offset="1" stop-color="#A86F06"/></linearGradient>'+
     '<radialGradient id="gL" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#F3ECD8"/><stop offset=".6" stop-color="#CDBE96"/><stop offset="1" stop-color="#9C8C66"/></radialGradient>'+
     '<radialGradient id="gW" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#7FA8DF"/><stop offset=".55" stop-color="#2F5A8F"/><stop offset="1" stop-color="#1E3A5F"/></radialGradient>'+
     '<linearGradient id="gRib" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#557A38"/><stop offset="1" stop-color="#3F5A2B"/></linearGradient>'+
     '<linearGradient id="vFog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3ECD8" stop-opacity=".98"/><stop offset=".7" stop-color="#F3ECD8" stop-opacity=".65"/><stop offset="1" stop-color="#F3ECD8" stop-opacity="0"/></linearGradient>'+
     '</defs>';
  h+='<rect width="'+MV_W+'" height="'+H+'" fill="url(#vG)"/>';
  // manchas de terreno e brilhos para dar cara de pintura
  for(let i=1;i<=last;i++){
    const p=mvPos(i,H),b=biomeOf(i),side=p.x>180?-1:1,ox=180+side*125;
    h+=E_(ox,p.y+10,110,62,MAP_HILL[b],' opacity=".55"')+E_(360-ox,p.y-40,70,34,MAP_HILL[b],' opacity=".35"');
    h+=E_(ox+side*-20,p.y-30,46,18,'#fff',' opacity=".12"');
  }
  // horizonte de cada cenário no lado livre
  for(let i=1;i<=last;i++){
    const p=mvPos(i,H),b=biomeOf(i),side=p.x>180?-1:1,bx=180+side*118,by=p.y+28;
    h+='<g transform="translate('+bx+','+by+') scale(.82) translate('+(-bx)+','+(-by)+')">'+mapBack(b,bx,by,i)+'</g>';
  }
  // enfeites
  for(let i=1;i<=last;i++){
    const p=mvPos(i,H),b=biomeOf(i),side=p.x>180?-1:1;
    h+=mapDeco(b,180+side*(78+mrnd(i,21)*40),p.y+60+mrnd(i,22)*10,1.25,i,23);
    h+=mapDeco(b,180+side*(150+mrnd(i,24)*14),p.y-24+mrnd(i,25)*12,1.1,i,26);
    h+=mapDeco(b,180-side*(158+mrnd(i,27)*10),p.y+44,1,i,28);
  }
  // caminho de doces
  const pts=[{x:180,y:H-10}];for(let i=1;i<=last;i++)pts.push(mvPos(i,H));pts.push({x:180,y:MV_TOP-70});
  const segs=mapSegs(pts),road='M'+pts[0].x+','+pts[0].y+segs.join(''),done='M'+pts[0].x+','+pts[0].y+segs.slice(0,P.level).join('');
  h+='<path d="'+road+'" fill="none" stroke="rgba(31,42,28,.35)" stroke-width="46" stroke-linecap="round" transform="translate(0,6)"/>'+
     '<path d="'+road+'" fill="none" stroke="#1F2A1C" stroke-width="44" stroke-linecap="round"/>'+
     '<path d="'+road+'" fill="none" stroke="#E9DCB8" stroke-width="38" stroke-linecap="round"/>'+
     '<path d="'+road+'" fill="none" stroke="#D6C597" stroke-width="24" stroke-linecap="round"/>'+
     '<path d="'+road+'" fill="none" stroke="#8A7A52" stroke-width="4" stroke-dasharray="12 12" stroke-linecap="round" opacity=".7"/>'+
     '<path d="'+done+'" fill="none" stroke="#F0B429" stroke-width="6" stroke-dasharray="12 12" stroke-linecap="round"/>';
  // faixas dos mundos
  for(let w=0;w*5<last;w++){
    const first=w*5+1,y=mvPos(first,H).y+98,wb=bossOf((w+1)*5);
    h+=ribbon(180,y,'Mundo '+(w+1),'Chefão final: '+wb.name);
  }
  for(let i=1;i<=last;i++){const p=mvPos(i,H);h+=candyNode(i,p.x,p.y);}
  // topo: névoa
  h+='<rect x="0" y="0" width="'+MV_W+'" height="'+(MV_TOP+40)+'" fill="url(#vFog)" pointer-events="none"/>';
  h+=mapCloud(70,70,1.6,'#fff')+mapCloud(290,54,1.9,'#fff')+mapCloud(190,96,1.3,'#f4f6fc');
  h+='<text x="180" y="44" text-anchor="middle" font-size="16" fill="#3F5A2B" font-family="Black Ops One, sans-serif" font-weight="400">Mais mundos à frente</text>';
  return h+'</svg>';
}
function tabSettings(){
  return '<div class="ups">'+[['music','🎵','Música'],['sfx','🔊','Efeitos sonoros'],['gun','🔫','Som dos tiros'],['vib','📳','Vibração'],['hq','✨','Gráficos em alta (sombras)']].map(a=>
    '<div class="up"><div class="ic">'+a[1]+'</div><div class="tx"><b>'+a[2]+'</b></div><button class="buy" data-set="'+a[0]+'" aria-pressed="'+(P.settings[a[0]]!==false)+'" style="background:'+(P.settings[a[0]]!==false?'#3F5A2B':'#B9A982')+'">'+(P.settings[a[0]]!==false?'Ligado':'Desligado')+'</button></div>').join('')+'</div>'+
    '<h3>Como jogar</h3><p class="sub">Arraste para os lados e escolha os portões: azuis somam soldados, vermelhos tiram, dourados melhoram a arma. Atire nas caixas e torres, desvie dos perigos e use o especial do herói quando o botão encher. No fim de cada mundo há um chefão especial com coroa.</p>';
}
function tabShop(){
  let h='<h3>Herói</h3><div class="heroes">';
  HERO_IDS.forEach(id=>{
    const x=HEROES[id],own=!!P.owned[id];
    h+='<button class="hero'+(P.hero===id?' sel':'')+(own?'':' locked')+'" data-hero="'+id+'">'+
      '<div class="nm"><span class="dot" style="background:'+hex(x.color)+'"></span>'+x.icon+' '+x.name+'</div>'+
      '<div class="ds">'+x.passive+'.<br>Especial: '+x.ult+'.</div>'+
      '<div class="pr">'+(own?(P.hero===id?'Escolhido':'Escolher'):'Comprar 🪙 '+x.price)+'</div></button>';
  });
  h+='</div><h3>Skins do exército</h3><div class="skins">';
  Object.keys(SKINS).forEach(id=>{
    const k=SKINS[id],own=!!P.skins[id];
    h+='<button class="skin'+(P.skin===id?' sel':'')+'" data-skin="'+id+'"><span class="sw" style="background:linear-gradient(135deg,'+hex(k.body)+' 55%,'+hex(k.helm)+' 55%)"></span><b>'+k.name+'</b><small>'+(own?(P.skin===id?'Em uso':'Usar'):'🪙 '+k.price)+'</small></button>';
  });
  h+='</div><h3>Melhorias</h3><div class="ups">';
  UPGRADES.forEach(u=>{
    const lv=P.up[u.id],max=lv>=UP_MAX,cost=upCost(u);
    h+='<div class="up"><div class="tx"><b>'+u.name+' · nível '+lv+'</b><small>'+u.desc+' por nível</small></div>'+
      '<button class="buy" data-up="'+u.id+'"'+(max||P.coins<cost?' disabled':'')+'>'+(max?'Máximo':'🪙 '+cost)+'</button></div>';
  });
  return h+'</div><p class="sub" style="margin-top:12px">Os inimigos e chefões ficam mais fortes conforme suas melhorias, então escolher bem os portões continua importando.</p>';
}
function tabMissions(){
  ensureDaily();
  const now=new Date(),mid=new Date(now);mid.setHours(24,0,0,0);const mins=Math.ceil((mid-now)/60000);
  let h='<h3>Missões do dia</h3><p class="sub">Novas missões em '+Math.floor(mins/60)+' h '+(mins%60)+' min.</p><div class="ups">';
  P.daily.list.forEach((m,i)=>{
    const done=m.prog>=m.target,pct=Math.min(100,m.prog/m.target*100);
    h+='<div class="up"><div class="tx"><b>'+missionText(m)+'</b><div class="pbar"><i style="width:'+pct+'%"></i></div><small>'+Math.min(m.prog,m.target)+' / '+m.target+'</small></div>'+
      '<button class="buy" data-claim="'+i+'"'+(!done||m.claimed?' disabled':'')+'>'+(m.claimed?'Recebido':'🪙 '+m.rw)+'</button></div>';
  });
  h+='</div><h3>Conquistas · '+Object.keys(P.ach).length+' de '+ACH.length+'</h3><div class="ups">';
  ACH.forEach(a=>{
    const got=!!P.ach[a.id],v=Math.min(P.stats[a.t]||0,a.n);
    h+='<div class="up ach'+(got?' got':'')+'"><div class="ic">'+(got?'🏆':'🔒')+'</div><div class="tx"><b>'+a.name+'</b><small>'+a.desc+' · '+(got?'concluída':v+' / '+a.n)+' · 🪙 '+a.rw+'</small></div></div>';
  });
  return h+'</div>';
}
function tabRank(){
  let h='<div class="seg">'+[['level','Campanha'],['endless','Infinito']].map(a=>'<button class="'+(rankMode===a[0]?'on':'')+'" data-rank="'+a[0]+'">'+a[1]+'</button>').join('')+'</div>';
  const tip='<p class="sub" style="margin-top:12px">Para seus amigos entrarem no placar, compartilhe o jogo pelo botão de compartilhar do claude.ai dando acesso de Colaborador. Quem tem acesso só de leitura vê o placar, mas não registra pontos.</p>';
  if(!NET.ready)return h+'<p>Conectando ao placar…</p>';
  if(!NET.db)return h+'<p>O placar online funciona quando o jogo é aberto pelo link do claude.ai com a conta conectada. Seu progresso continua salvo neste aparelho.</p>';
  const key=rankMode;
  const rows=NET.rows.filter(r=>(r[key]||0)>0).sort((a,b)=>(b[key]||0)-(a[key]||0)).slice(0,30);
  if(!rows.length)return h+'<p>Ninguém marcou pontos ainda. Vença uma fase ou corra no modo infinito para aparecer aqui.</p>'+tip;
  h+='<div class="rank">'+rows.map((r,i)=>'<div class="rrow'+(r.id===NET.me?' me':'')+'"><span class="pos">'+(i<3?['🥇','🥈','🥉'][i]:i+1)+'</span><span class="nm" data-uid="'+String(r.id).replace(/[^\w-]/g,'')+'">'+(r.id===NET.me?'Você':'Jogador')+'</span><span class="vl">'+(key==='level'?(r.level|0)+' fases':(r.endless|0)+' m')+'</span></div>').join('')+'</div>';
  return h+tip;
}
let sheetTab=null;
const SHEET_T={shop:'Loja',missions:'Missões',rank:'Placar',settings:'Configurações'};
function renderTop(){
  ensureDaily();
  $('homeCoins').textContent=P.coins;$('homeLvl').textContent=P.level;$('homeHero').textContent=HEROES[P.hero].icon;
  const w=Math.floor((P.level-1)/5),stars=[1,2,3,4,5].reduce((a,k)=>a+(P.stars[w*5+k]||0),0);
  $('worldPill').textContent='Mundo '+(w+1)+' · fase '+(((P.level-1)%5)+1)+'/5 · ★ '+stars+'/15';
  const n=P.daily.list.filter(m=>m.prog>=m.target&&!m.claimed).length;
  ['missBadge','missBadge2'].forEach(id=>{const el=$(id);el.textContent=n;el.classList.toggle('show',n>0);});
  document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('on',(b.dataset.nav==='map'&&!sheetTab)||b.dataset.nav===sheetTab));
}
function renderSheet(){
  const sh=$('sheet');
  if(!sheetTab){sh.classList.add('hidden');return;}
  const body=sheetTab==='shop'?tabShop():sheetTab==='missions'?tabMissions():sheetTab==='rank'?tabRank():tabSettings();
  $('sheetCard').innerHTML='<div class="sheetHead"><h2>'+SHEET_T[sheetTab]+'</h2><button class="xbtn" data-act="close" aria-label="Fechar">✕</button></div>'+
    (sheetTab==='shop'?'<div class="wallet">🪙 '+P.coins+'</div>':'')+body;
  sh.classList.remove('hidden');
  if(sheetTab==='rank')fillNames();
}
function renderMenu(){renderTop();renderSheet();}
function openSheet(t){sheetTab=t;closePop();renderMenu();}
function closePop(){$('lvlPop').classList.add('hidden');}
function renderMap(){
  const wrap=$('mapWrap'),seen=P.seenLevel||1;
  newUnlock=P.level>seen;
  wrap.innerHTML=mapSVG();
  const sc=Math.min(wrap.clientWidth,560)/MV_W,target=lv=>Math.max(0,mvPos(lv,mapH).y*sc-wrap.clientHeight*.55);
  if(newUnlock){
    wrap.scrollTop=target(Math.max(1,seen));
    setTimeout(()=>{if(wrap.scrollTo)wrap.scrollTo({top:target(P.level),behavior:'smooth'});else wrap.scrollTop=target(P.level);},350);
    setTimeout(()=>SFX.achieve(),900);
    P.seenLevel=P.level;save();
  }else wrap.scrollTop=target(P.level);
}
function openLevelPop(lv){
  const bo=bossOf(lv),bi=BIOMES[biomeOf(lv)],st=P.stars[lv]||0,done=lv<P.level;
  let stars='';for(let k=0;k<3;k++)stars+=k<st?'★':'<span class="off">★</span>';
  $('popCard').innerHTML='<div class="popTitle'+(bo.world?' world':'')+'">'+(bo.world?'👑 ':'')+'Fase '+lv+'</div>'+
    '<button class="xbtn" data-act="closepop" aria-label="Fechar">✕</button>'+
    '<div class="popStars">'+stars+'</div>'+
    '<div class="bossBox'+(bo.world?' world':'')+'"><div class="bi">'+bo.icon+'</div><div><b>'+(bo.world?'Chefão do mundo: ':'')+bo.name+'</b><small>'+bo.power+'</small><small>Cenário: '+bi.name+'</small></div></div>'+
    '<p>'+(done?'Você já venceu esta fase. Repetir rende metade das moedas, mas vale para buscar 3 estrelas.':bo.world?'Chefão especial com três fases de luta. Vencer dá um baú lendário.':'Vença o chefão para liberar a próxima fase e ganhar um baú.')+'</p>'+
    '<button class="play" data-play="'+lv+'">Jogar</button>';
  $('lvlPop').classList.remove('hidden');
}
$('menu').addEventListener('click',e=>{
  audioInit();
  const t=e.target.closest('button,[data-lv]');
  if(!t){if(e.target.id==='sheet'){sheetTab=null;renderMenu();}else if(e.target.id==='lvlPop')closePop();return;}
  const d=t.dataset;
  if(d.lv){const lv=+d.lv;if(lv<=P.level){SFX.click();openLevelPop(lv);}else{SFX.bad();toast('Fase bloqueada','#7a83a6');}return;}
  SFX.click();
  if(d.nav){openSheet(d.nav==='map'?null:d.nav);return;}
  if(d.act){
    if(d.act==='close'){sheetTab=null;renderMenu();}
    else if(d.act==='closepop')closePop();
    else if(d.act==='endless'){startEndless();}
    else openSheet(d.act);
    return;
  }
  if(d.hero){
    const id=d.hero,x=HEROES[id];
    if(!P.owned[id]){if(P.coins<x.price){toast('Faltam '+(x.price-P.coins)+' moedas','#ff3b55');return;}P.coins-=x.price;P.owned[id]=true;}
    P.hero=id;save();renderMenu();renderMap();
  }else if(d.skin){
    const k=SKINS[d.skin];
    if(!P.skins[d.skin]){if(P.coins<k.price){toast('Faltam '+(k.price-P.coins)+' moedas','#ff3b55');return;}P.coins-=k.price;P.skins[d.skin]=true;statMax('skinsOwned',Object.keys(P.skins).length);}
    P.skin=d.skin;applySkin();save();renderMenu();
  }else if(d.up){
    const u=UPGRADES.find(q=>q.id===d.up),c=upCost(u);
    if(P.coins>=c&&P.up[u.id]<UP_MAX){P.coins-=c;P.up[u.id]++;save();renderMenu();}
  }else if(d.claim!=null){
    const m=P.daily.list[+d.claim];
    if(m&&m.prog>=m.target&&!m.claimed){m.claimed=true;P.coins+=m.rw;SFX.coin();save();renderMenu();}
  }else if(d.play){closePop();startLevel(+d.play);}
  else if(d.set){P.settings[d.set]=P.settings[d.set]===false;if(d.set==='hq'){perf.checked=true;applyQuality();}applyAudioSettings();if(d.set==='vib'&&P.settings.vib)vib(40);if(d.set==='gun'&&P.settings.gun){audioInit();AU.last.sh=0;SFX.shoot();}save();renderMenu();}
  else if(d.rank){rankMode=d.rank;renderMenu();}
});
$('menu').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.lv){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
function openMenu(){
  ['over','win'].forEach(id=>$(id).classList.add('hidden'));
  hideRunHud();setTrack('menu');
  S.level=P.level;S.mode='menu';S.count=10;S.armyX=0;S.targetX=0;S.armyZ=0;
  lastCoinTxt=-1;S.coinsRun=0;$('armyLabel').style.display='none';
  $('progBar').style.display='block';$('distTxt').style.display='none';
  sheetTab=null;closePop();
  $('menu').classList.remove('hidden');renderMenu();renderMap();
}
function startRun(lv,endless){
  audioInit();
  buildLevel(lv,endless);S.level=endless?1:lv;
  Object.assign(S,{count:10+P.up.start*3+(heroId()==='comandante'?5:0),armyX:0,targetX:0,armyZ:0,tier:0,xp:0,dmgB:0,rateB:0,rangeB:0,
    ult:0,shieldT:0,furyT:0,coinsRun:0,kills:0,fireT:.3,meleeT:0,shake:0,speed:13,dist:0,maxCount:0});
  bulletMat.color.setHex(WEAPONS[0].color);tintArmyGuns();
  for(const b of bullets){b.on=false;b.m.visible=false;}
  makeHeroMesh();
  $('bossWrap').style.display='none';$('bossBar').querySelector('i').style.width='100%';
  $('progBar').style.display='block';$('distTxt').style.display=endless?'block':'none';
  ['menu','over','win'].forEach(id=>$(id).classList.add('hidden'));
  $('ultBtn').style.display='block';$('wchip').style.display='block';$('ultIcon').textContent=HEROES[heroId()].icon;
  S.mode='run';lastUlt=-1;lastCoinTxt=-1;updateHUD();updateArmyLabel();updHudFrame();updCam(0,true);showHint();setTrack('run');
}
function startLevel(lv){startRun(lv||P.level,false);}
function startEndless(){startRun(1,true);}
$('btnRetry').addEventListener('click',()=>{SFX.click();if(S.endless)startEndless();else startLevel(S.level);});
$('btnOverMenu').addEventListener('click',()=>{SFX.click();openMenu();});
$('btnNext').addEventListener('click',()=>{SFX.click();openMenu();});
$('btnNextPlay').addEventListener('click',()=>{SFX.click();startLevel(P.level);});

/* ================= Início ================= */
function init(){applySkin();applyQuality();ensureDaily();openMenu();requestAnimationFrame(frame);setTimeout(netInit,0);}
const fontReady=(document.fonts&&document.fonts.load)
  ?Promise.race([Promise.all([document.fonts.load('64px "Black Ops One"'),document.fonts.load('800 16px "Rubik"'),document.fonts.load('700 16px "Rubik"')]),new Promise(r=>setTimeout(r,1800))])
  :Promise.resolve();
fontReady.catch(()=>{}).then(init);

window.__game={get bfx(){return bfx;},get blocks(){return blocks;},S,P,E,update,startLevel,startEndless,useUlt,openMenu,get boss(){return boss;},get groups(){return groups;},get rows(){return rows;},get hazards(){return hazards;},get rockets(){return rockets;}};
})();
</script>
