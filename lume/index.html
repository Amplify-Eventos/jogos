<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#06141c">
  <title>Lume</title>
  <link rel="stylesheet" href="game.css?v=1.1">
</head>
<body>
  <canvas id="jogo" width="390" height="844"></canvas>

  <section id="titulo">
    <img src="art/capa.jpg?v=1.1" alt="">
    <div class="painel">
      <p class="marca">Amplify</p>
      <h1>Lume</h1>
      <p>A maré de vidro sobe. A lanterna atira sozinha. História, modos, infinito e ranque. Arraste o dedo para andar.</p>
      <button id="acender" type="button" disabled>Acendendo…</button>
      <button id="versao" type="button">1.1</button>
    </div>
  </section>

  <section id="versoes" hidden>
    <div class="caixa">
      <p class="marca">Versões</p>
      <h2 id="versao-atual">1.1</h2>
      <ul id="lista-versoes"></ul>
      <button id="fechar-versoes" type="button">Fechar</button>
    </div>
  </section>

  <section id="mapa" hidden>
    <img src="art/mapa.jpg" alt="">
    <div class="painel">
      <p class="marca">Mapa</p>
      <button id="voltar" type="button" hidden>Voltar</button>
      <h2 id="mapa-titulo">A ilha</h2>
      <p id="farol-nivel"></p>
      <div id="fases"></div>
    </div>
  </section>

  <section id="cartas" hidden>
    <p class="olho">A lanterna pede um reforço</p>
    <div id="opcoes"></div>
  </section>

  <section id="fim" hidden>
    <img id="fim-arte" alt="">
    <div class="caixa">
      <h2 id="fim-titulo"></h2>
      <p id="fim-texto"></p>
      <p id="fim-stats"></p>
      <button id="de-novo" type="button">De novo</button>
      <button id="ao-mapa" type="button">Mapa</button>
    </div>
  </section>

  <script src="game.js?v=1.1"></script>
  <script>
    (function () {
      var lista = [
        ["1.1", "O carimbo da onda saiu de cima do cais."],
        ["1.0", "Vitória e derrota têm desenho. O som é a lanterna e a maré."],
        ["0.9", "A maré ocupa a tela. A lanterna atira sozinha. O reforço troca o desenho."],
        ["0.8", "Na partida a ilha ocupa a tela. O menu fica na faixa de baixo. O mapa abre antes."],
        ["0.7", "A capa é o faroleiro no cais, de cima."],
        ["0.6", "A pose de agir do caranguejo não apaga mais o quadro."],
        ["0.5", "Na partida o menu não cobre a ilha."],
        ["0.4", "A capa passou a ser o faroleiro na ilha, de cima."],
        ["0.3", "Toque na versão abre o que mudou."],
        ["0.2", "Caranguejo, gaivota e onda ganharam desenho de agir e de cair."],
        ["0.1", "Faroleiro de cima: passo, acerto na lanterna e queda."]
      ];
      var painel = document.getElementById("versoes");
      var ul = document.getElementById("lista-versoes");
      lista.forEach(function (item) {
        var li = document.createElement("li");
        li.textContent = item[0] + " — " + item[1];
        ul.appendChild(li);
      });
      document.getElementById("versao").onclick = function () { painel.hidden = false; };
      document.getElementById("fechar-versoes").onclick = function () { painel.hidden = true; };
    })();
  </script>
</body>
</html>
